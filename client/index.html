    <title>Rising Talents — Diwali Carnival Exhibition & Show</title>

    <!--
      Site-wide social card. WhatsApp / Facebook / Twitter scrapers do not run
      JavaScript, so these static tags are what they read for ANY url — values
      must be absolute. Per-page metadata is added by the app (Helmet) for
      JS-capable crawlers such as Google.
      TODO: replace with the client's real domain once purchased.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rising Talentz" />
    <meta property="og:title" content="Rising Talents — Diwali Carnival Exhibition & Show" />
    <meta
      property="og:description"
      content="Book a stall, sponsorship or stage entry. 24 & 25 October 2026, Rassaz Ground, Mira Road East."
    />
    <meta property="og:url" content="https://zeeshanshaikh95.github.io/rising-talentz/" />
    <meta
      property="og:image"
      content="https://zeeshanshaikh95.github.io/rising-talentz/og-rising-talents.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://zeeshanshaikh95.github.io/rising-talentz/og-rising-talents.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rising Talentz" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
